<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 320" width="320" height="320">
  <defs>
    <linearGradient id="avatarGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#6366F1" />
    </linearGradient>
    <radialGradient id="meshGrad" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#080C14" />
    </radialGradient>
  </defs>
  <rect width="320" height="320" rx="32" fill="url(#meshGrad)" />
  <rect x="4" y="4" width="312" height="312" rx="28" fill="none" stroke="url(#avatarGrad)" stroke-width="2" stroke-opacity="0.3" />
  
  <!-- Subtle tech circuit lines -->
  <path d="M40 80 H80 L100 100 H160" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.2" fill="none" />
  <path d="M280 240 H240 L220 220 H160" stroke="#00F0FF" stroke-width="1.5" stroke-opacity="0.2" fill="none" />
  <circle cx="80" cy="80" r="3" fill="#38BDF8" fill-opacity="0.4" />
  <circle cx="240" cy="240" r="3" fill="#00F0FF" fill-opacity="0.4" />

  <!-- Monogram Shield -->
  <circle cx="160" cy="130" r="54" fill="#0F172A" stroke="url(#avatarGrad)" stroke-width="2.5" />
  <text x="160" y="145" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="44" font-weight="900" fill="url(#avatarGrad)" letter-spacing="-1">DM</text>
  
  <!-- Sub-label -->
  <rect x="60" y="210" width="200" height="32" rx="16" fill="#141E33" stroke="rgba(255,255,255,0.08)" stroke-width="1" />
  <text x="160" y="231" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="12" font-weight="700" fill="#94A3B8" letter-spacing="1.5">DANIEL MUSEMBI</text>

  <text x="160" y="270" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, Segoe UI, Roboto, sans-serif" font-size="11" font-weight="500" fill="#64748B">Replace with portrait in /assets/images/</text>
</svg>
